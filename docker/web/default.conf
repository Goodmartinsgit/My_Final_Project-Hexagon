server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static frontend files with SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/ to the Flask backend.
    # ── LOCAL (docker-compose): proxies to the 'api' container service name.
    # ── PRODUCTION (EC2 ASG): this file is volume-mounted over at container
    #    start by the launch template user_data, which writes a config with the
    #    real internal ALB DNS name. The proxy_pass below is the docker-compose
    #    fallback only — it will never be reached in production.
    location /api/ {
        proxy_pass http://api:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Health endpoint — used by the external ALB target group health check.
    location /health {
        default_type application/json;
        return 200 '{"status":"ok","tier":"web"}';
    }
}
